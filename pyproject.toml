[project]
name = "rossmann"
version = "0.1.0"
description = "Nieoficjalny interfejs CLI do sklepu rossmann.pl"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
]

[project.scripts]
rossmann = "rossmann.cli:run"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rossmann"]

[tool.uv]
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
